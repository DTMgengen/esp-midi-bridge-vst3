name: macOS build and validation

on:
  push:
    branches: [main, codex/macos-support]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            parallel: 3
          - runner: macos-15-intel
            arch: x86_64
            parallel: 4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
      ESP_MACOS_ARCHITECTURES: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build VST3, AU and Standalone
        run: bash scripts/build-macos.sh
      - name: Check bundles and validate Audio Unit
        shell: bash
        run: |
          products=build-macos/ESPMidiBridge_artefacts/Release
          vst="$products/VST3/ESP MIDI Bridge.vst3"
          au="$products/AU/ESP MIDI Bridge.component"
          app="$products/Standalone/ESP MIDI Bridge.app"
          for bundle in "$vst" "$au" "$app"; do
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
            lipo "$bundle/Contents/MacOS/$executable" -verify_arch "$ESP_MACOS_ARCHITECTURES"
          done
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          # This install is only on the disposable GitHub-hosted runner.
          # Refresh its registrar so auval sees the newly copied component.
          components=/Library/Audio/Plug-Ins/Components
          sudo mkdir -p "$components"
          sudo ditto "$au" "$components/ESP MIDI Bridge.component"
          sudo killall -TERM AudioComponentRegistrar || true
          log="$RUNNER_TEMP/esp-auval.log"
          for attempt in 1 2 3 4; do
            if auval -v aufx EmB1 GgAu >"$log" 2>&1 && grep -Fq 'AU VALIDATION SUCCEEDED' "$log"; then
              cat "$log"
              exit 0
            fi
            cat "$log"
            grep -Fq "didn't find the component" "$log" || exit 1
            sleep 2
          done
          exit 1
      - name: Test pitch, MIDI capture, VST3 and CoreMIDI
        shell: bash
        run: |
          cmake --build build-macos --config Release
          ctest --test-dir build-macos -C Release --output-on-failure --timeout 480 --parallel 2
