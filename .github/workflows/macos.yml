name: macOS build and validation

on:
  push:
    branches: [main, codex/macos-support, codex/public-readiness]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            parallel: 3
          - runner: macos-15-intel
            arch: x86_64
            parallel: 4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
      ESP_MACOS_ARCHITECTURES: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build VST3, AU and Standalone
        run: bash scripts/build-macos.sh
      - name: Check bundles and validate Audio Unit
        shell: bash
        run: |
          products=build-macos/ESPMidiBridge_artefacts/Release
          vst="$products/VST3/ESP MIDI Bridge.vst3"
          au="$products/AU/ESP MIDI Bridge.component"
          app="$products/Standalone/ESP MIDI Bridge.app"
          for bundle in "$vst" "$au" "$app"; do
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
            lipo "$bundle/Contents/MacOS/$executable" -verify_arch "$ESP_MACOS_ARCHITECTURES"
          done
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          # This install is only on the disposable GitHub-hosted runner.
          # Refresh its registrar so auval sees the newly copied component.
          components=/Library/Audio/Plug-Ins/Components
          sudo mkdir -p "$components"
          sudo ditto "$au" "$components/ESP MIDI Bridge.component"
          sudo killall -TERM AudioComponentRegistrar || true
          log="$RUNNER_TEMP/esp-auval.log"
          for attempt in 1 2 3 4; do
            if auval -v aufx EmB1 GgAu >"$log" 2>&1 && grep -Fq 'AU VALIDATION SUCCEEDED' "$log"; then
              cat "$log"
              exit 0
            fi
            cat "$log"
            grep -Fq "didn't find the component" "$log" || exit 1
            sleep 2
          done
          exit 1
      - name: Test pitch, MIDI capture, VST3 and CoreMIDI
        shell: bash
        run: |
          cmake --build build-macos --config Release
          ctest --test-dir build-macos -C Release --output-on-failure --timeout 480 --parallel 2
      - name: Package reviewed native Mac preview
        run: bash scripts/package-macos.sh
      - name: Validate VST3 with pluginval
        timeout-minutes: 5
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip \
            -o "$RUNNER_TEMP/pluginval.zip"
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  $RUNNER_TEMP/pluginval.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP/pluginval"
          export ESP_MIDI_BRIDGE_TAKES_DIR="$RUNNER_TEMP/pluginval-takes"
          "$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval" \
            --validate "$PWD/build-macos/ESPMidiBridge_artefacts/Release/VST3/ESP MIDI Bridge.vst3" \
            --strictness-level 5 --random-seed 42 2>&1 | tee "$RUNNER_TEMP/pluginval.log"
          grep -Fq 'SUCCESS' "$RUNNER_TEMP/pluginval.log"
          if grep -Eq 'FAILURE|No plugins found|Num plugins found: 0' "$RUNNER_TEMP/pluginval.log"; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/ESP-MIDI-Bridge-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
